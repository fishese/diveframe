name: Nightly signed APK

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-signed-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare native web assets
        shell: bash
        run: |
          sh scripts/fetch-libdivecomputer.sh
          npm run prepare:sql-wasm
          npm run native:sync

      - name: Build release APK
        working-directory: android
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          nightly_version_code=$((100000 + RUN_NUMBER))
          short_sha="${COMMIT_SHA:0:7}"
          nightly_version_name="nightly.${RUN_NUMBER}.${short_sha}"
          bash gradlew --no-daemon \
            -PnightlyVersionCode="$nightly_version_code" \
            -PnightlyVersionName="$nightly_version_name" \
            assembleRelease

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare nightly asset
        shell: bash
        run: |
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" diveframe-nightly.apk
          sha256sum diveframe-nightly.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diveframe-nightly-${{ github.run_number }}
          path: diveframe-nightly.apk
          if-no-files-found: error

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: DiveFrame nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: diveframe-nightly.apk
          body: |
            Signed GitHub nightly APK.

            Commit: ${{ github.sha }}
            Version code: 100000 + workflow run ${{ github.run_number }}

            This channel is signed separately from F-Droid. Export app data
            before switching between the GitHub nightly and F-Droid builds.
