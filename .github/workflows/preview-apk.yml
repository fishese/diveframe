name: Preview signed APK

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-signed-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_sha256: ${{ steps.preview_asset.outputs.sha256 }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reject an obsolete Preview rerun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_NUMBER: ${{ github.run_number }}
          PREVIEW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/public/whats-new.json?ref=main" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/current-preview-feed.json"
          node scripts/update-preview-feed.mjs "$PREVIEW_RUN_NUMBER" "$PREVIEW_SOURCE_SHA" "$RUNNER_TEMP/current-preview-feed.json"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'build-tools;29.0.3' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare native web assets
        shell: bash
        run: |
          sh scripts/fetch-libdivecomputer.sh
          npm run prepare:sql-wasm
          npm run native:sync

      - name: Build Preview APK
        id: preview_version
        working-directory: android
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          preview_version_code=$((100000 + RUN_NUMBER))
          short_sha="${COMMIT_SHA:0:7}"
          preview_version_name="preview.${RUN_NUMBER}.${short_sha}"
          echo "name=$preview_version_name" >> "$GITHUB_OUTPUT"
          echo "code=$preview_version_code" >> "$GITHUB_OUTPUT"
          bash gradlew --no-daemon \
            -PpreviewVersionCode="$preview_version_code" \
            -PpreviewVersionName="$preview_version_name" \
            assemblePreview

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Preview asset
        id: preview_asset
        shell: bash
        env:
          PREVIEW_VERSION_NAME: ${{ steps.preview_version.outputs.name }}
          PREVIEW_VERSION_CODE: ${{ steps.preview_version.outputs.code }}
        run: |
          set -euo pipefail
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" diveframe-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging diveframe-preview.apk > "$RUNNER_TEMP/preview-badging.txt"
          grep -F "package: name='cc.fishese.divelog.preview' versionCode='$PREVIEW_VERSION_CODE' versionName='$PREVIEW_VERSION_NAME'" "$RUNNER_TEMP/preview-badging.txt"
          echo "sha256=$(sha256sum diveframe-preview.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diveframe-preview-${{ github.run_number }}
          path: diveframe-preview.apk
          if-no-files-found: error

      - name: Align the mutable Preview tag with the built source
        shell: bash
        env:
          PREVIEW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          previous_sha="$(git ls-remote --refs origin refs/tags/preview | cut -f 1)"
          git push --force-with-lease="refs/tags/preview:${previous_sha}" \
            origin "${PREVIEW_SOURCE_SHA}:refs/tags/preview"

      - name: Publish Preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: DiveFrame Preview
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: diveframe-preview.apk
          body: |
            Signed GitHub Preview APK.

            Commit: ${{ github.sha }}
            Package: cc.fishese.divelog.preview
            Version name: ${{ steps.preview_version.outputs.name }}
            Version code: ${{ steps.preview_version.outputs.code }}
            APK SHA-256: ${{ steps.preview_asset.outputs.sha256 }}

            Source commit: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

            Preview is separately installable from production and uses
            separate app-private storage. This channel is signed separately
            from F-Droid.

  update-feed:
    name: Publish Preview update feed
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record published Preview
        shell: bash
        env:
          PREVIEW_RUN_NUMBER: ${{ github.run_number }}
          PREVIEW_SOURCE_SHA: ${{ github.sha }}
          PREVIEW_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            node scripts/verify-preview-release.mjs \
              "$PREVIEW_RUN_NUMBER" "$PREVIEW_SOURCE_SHA" "$PREVIEW_APK_SHA256"
            node scripts/update-preview-feed.mjs \
              "$PREVIEW_RUN_NUMBER" \
              "$PREVIEW_SOURCE_SHA"
            git add -- public/whats-new.json

            if git diff --cached --quiet; then
              echo "Preview update feed already records this release."
              exit 0
            fi

            git commit -m "Publish Preview ${PREVIEW_RUN_NUMBER} update feed"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Feed push conflicted on attempt ${attempt}; refreshing main."
          done

          echo "::error::Preview APK was published, but its update feed could not be pushed."
          exit 1
