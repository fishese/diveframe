name: Preview signed APK

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-signed-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'build-tools;29.0.3' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare native web assets
        shell: bash
        run: |
          sh scripts/fetch-libdivecomputer.sh
          npm run prepare:sql-wasm
          npm run native:sync

      - name: Build Preview APK
        working-directory: android
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          preview_version_code=$((100000 + RUN_NUMBER))
          short_sha="${COMMIT_SHA:0:7}"
          preview_version_name="preview.${RUN_NUMBER}.${short_sha}"
          bash gradlew --no-daemon \
            -PpreviewVersionCode="$preview_version_code" \
            -PpreviewVersionName="$preview_version_name" \
            assemblePreview

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Preview asset
        shell: bash
        run: |
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" diveframe-preview.apk
          sha256sum diveframe-preview.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diveframe-preview-${{ github.run_number }}
          path: diveframe-preview.apk
          if-no-files-found: error

      - name: Publish Preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: DiveFrame Preview
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: diveframe-preview.apk
          body: |
            Signed GitHub Preview APK.

            Commit: ${{ github.sha }}
            Package: cc.fishese.divelog.preview
            Version name: `preview.${{ github.run_number }}.<short-sha>`
            Version code: 100000 + workflow run ${{ github.run_number }}

            Preview is separately installable from production and uses
            separate app-private storage. This channel is signed separately
            from F-Droid.
