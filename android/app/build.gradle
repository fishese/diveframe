apply plugin: 'com.android.application'

def configuredPreviewVersionCode = project.findProperty('previewVersionCode')
def configuredPreviewVersionName = project.findProperty('previewVersionName')
def libdivecomputerPin = new Properties()
file('src/main/cpp/libdivecomputer.pin').withInputStream {
    libdivecomputerPin.load(it)
}
def libdivecomputerCommit = libdivecomputerPin.getProperty('commit')
if (!(libdivecomputerCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException('libdivecomputer.pin must contain a full commit')
}

android {
    namespace = "cc.fishese.divelog"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = rootProject.ext.ndkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "cc.fishese.divelog"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "1.0.29"
        buildConfigField "String", "LIBDIVECOMPUTER_COMMIT", "\"${libdivecomputerCommit}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // The native build currently targets arm64-v8a.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                targets "diveframe_dc"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        preview {
            initWith release
            applicationIdSuffix ".preview"
            matchingFallbacks = ['release']
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("preview")) { variant ->
        variant.outputs.each { output ->
            if (configuredPreviewVersionCode) {
                output.versionCode.set(configuredPreviewVersionCode.toInteger())
            }
            if (configuredPreviewVersionName) {
                output.versionName.set(configuredPreviewVersionName)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
